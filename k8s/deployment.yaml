# ── Platform single-container Deployment ───────────────────────────────────────
#
# One pod = one process tree: scripts/start.js → supervisor spawns server.js +
# LiteLLM + OpenConnector + Postgres as localhost child processes (exactly like
# `npm start`). replicas: 1 + Recreate because the PVC is RWO and the in-process
# agent session is stateful and not horizontally scalable.
#
# Image tag: CI (.github/workflows/docker-deploy.yml) builds, pushes to Harbor,
# then commits the new sha tag back into THIS file (GitOps — ArgoCD auto-sync
# detects the manifest change and rolls out). Until CI runs, :latest is the
# fallback for first deploy / local testing.
#
# In-cluster pulls of harbor.local/* go through the k3s containerd mirror
# (registries.yaml: harbor.local → http://localhost:30880, insecure_skip_verify).
# HOWEVER, containerd does not honor the registries.yaml `auth` block for mirrored
# endpoints (it keys auth by endpoint host, not mirror name), so a 401 Unauthorized
# results unless a per-pod imagePullSecret supplies the credentials. Every other
# harbor.local deployment in this cluster (lawcraw, law-bench, review-agent)
# references a `harbor-pull` secret — we follow the same pattern. Create it once:
#   kubectl -n platform-private create secret docker-registry harbor-pull \
#     --docker-server=harbor.local \
#     --docker-username=<robot-or-admin> \
#     --docker-password=<secret>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  labels:
    app.kubernetes.io/name: platform
spec:
  replicas: 1
  strategy:
    # Stateful singleton: kill the old pod before starting the new one so the
    # RWO PVC + the single agent session are never double-mounted.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
    spec:
      imagePullSecrets:
        # Every harbor.local/* deployment in this cluster (lawcraw, law-bench,
        # review-agent) references a per-namespace `harbor-pull` secret. The k3s
        # registries.yaml mirror resolves harbor.local → localhost:30880, but
        # containerd keys mirror auth by endpoint host (localhost:30880), not
        # mirror name — so the registries.yaml `auth` block is never sent and
        # pulls 401 without this per-pod secret. Create it once (see top comment).
        - name: harbor-pull
      containers:
        - name: platform
          # Image tag is updated automatically by CI (commit-back GitOps).
          # To deploy a specific build locally, edit this tag or run
          # `make k8s-deploy TAG=sha-<short>` (see Makefile).
          image: harbor.local/paas_private/platform:sha-073c76c
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: PLATFORM_DATA_DIR
              value: /data
            # VOLCES_API_KEY is optional: server.js has a fallback key baked in.
            # Create the secret to override: kubectl -n platform-private create
            # secret generic platform-secrets --from-literal=volces-api-key=...
            - name: VOLCES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: volces-api-key
                  optional: true
          resources:
            # Heavy single container: Node server + LiteLLM (Python venv) +
            # Postgres + OpenConnector all in one pod. Tune to node capacity.
            requests:
              cpu: 1000m
              memory: 1500Mi
            limits:
              cpu: 3000m
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
          # startupProbe gates liveness/readiness until server.js (and its
          # sidecars) finish cold-start: first-run Postgres initdb + LiteLLM
          # prisma db push + OpenConnector warmup can take 1-3 min. The
          # supervisor's own START_TIMEOUT is 120s; give k8s a 300s window.
          startupProbe:
            httpGet:
              path: /api/config
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-data
