# ── Platform single-container Deployment (cheap-cluster live layout) ──────────
#
# This manifest mirrors the LIVE deployment on the cheap k3s cluster (as of
# 2026-09-07). Key differences from the earlier PVC/harbor design:
#
# - Runs in the `default` namespace, pinned to node cheap-5 via nodeName.
# - hostNetwork: the pod listens on the node itself. PORT=3100 because cheap-5
#   also runs a law-craw pod whose hostPort 3000 would otherwise DNAT-intercept
#   every local connect to :3000 (including the platform's own self-checks).
# - External entry: cheap-5 runs rrev-cheap1.service, a reverse SSH tunnel to
#   cheap-1 (the public forward server), carrying 127.0.0.1:3100 → cheap-1's
#   127.0.0.1:3000 and 127.0.0.1:32080 (sub2api NodePort) → cheap-1:32080.
#   Caddy on cheap-1 routes craw.finddatatech.cloud → 127.0.0.1:3000 and
#   token.finddatatech.cloud → 127.0.0.1:32080 (Safeline WAF fronts 80/443).
# - LLM traffic goes to the sub2api gateway over the SAME tunnel
#   (LLM_BASE_URL=http://127.0.0.1:32080). ClusterIP services are not
#   reachable from a hostNetwork pod on cheap-5, so this loopback path is the
#   deliberate design, not a workaround.
# - Data lives on hostPath dirs (no PVC): /opt/platform → /data (SQLite +
#   documents) and /opt/patch-dsh-home → /opt/dsh-home (dsh profile home).
#
# Image distribution: images are imported directly into cheap-5's containerd
# (`k3s ctr images import`) — imagePullPolicy: IfNotPresent with a bare local
# tag. The Harbor + ArgoCD pipeline will replace this flow; when it does,
# switch the tag to harbor.local/... and restore imagePullSecrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: default
  labels:
    app: platform
spec:
  replicas: 1
  strategy:
    # Stateful singleton: kill the old pod before starting the new one so the
    # hostPath data and the single agent session are never double-mounted.
    type: Recreate
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
    spec:
      # Pin to cheap-5: the data hostPath and the reverse tunnel live there.
      nodeName: cheap-5
      hostNetwork: true
      # Let hostNetwork pods still resolve cluster-internal names.
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: platform
          # Bare local tag: imported into cheap-5 containerd, not pulled.
          # Bump the tag on every image rebuild (import + set image).
          image: platform:llm2
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            # 3100, not 3000: cheap-5 hostPort 3000 is taken by law-craw and
            # CNI DNAT-intercepts local connects (see header).
            - name: PORT
              value: "3100"
            - name: PLATFORM_DATA_DIR
              value: /data
            # sub2api gateway through the reverse tunnel loopback.
            - name: LLM_BASE_URL
              value: http://127.0.0.1:32080
            - name: DEFAULT_MODEL
              value: deepseek-v4-flash-0731
            # Create once:
            #   kubectl -n default create secret generic platform-secrets \
            #     --from-literal=llm-api-key=sk-...
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: llm-api-key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshhome
              mountPath: /opt/dsh-home
            # Hot-fix overlay for the image's /opt/dsh tree: the shipped image
            # was built with legacy-peer-deps, which skipped 19 transitive peer
            # packages the dsh runtime needs at boot (ERR_MODULE_NOT_FOUND on
            # @deepseek-ai/dsh-sandbox first). /opt/dsh-fixed/dsh on cheap-5 is
            # a complete linux-native install (npmmirror, same pins as the
            # Dockerfile). Drop this mount once an image built with the fixed
            # Dockerfile (explicit package list) is deployed.
            - name: dshroot
              mountPath: /opt/dsh
          # startupProbe gates liveness until server.js + the dsh agent finish
          # cold start. Liveness is deliberately lax (the supervisor restarts
          # children internally; k8s should only intervene on true hangs).
          startupProbe:
            httpGet:
              path: /api/config
              port: 3100
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /api/config
              port: 3100
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 100
      volumes:
        - name: data
          hostPath:
            path: /opt/platform
            type: Directory
        - name: dshhome
          hostPath:
            path: /opt/patch-dsh-home
            type: Directory
        - name: dshroot
          hostPath:
            path: /opt/dsh-fixed/dsh
            type: Directory
