name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint → typecheck → unit → locales → build → e2e (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      # npm 11 (bundled with Node 25) is required by the lockfile format;
      # see release.yml and Dockerfile for the same pin.
      - name: Install dependencies (skip resource bundling)
        env:
          PLATFORM_SKIP_WEB_BUILD: "1"
          PLATFORM_SKIP_BUNDLE: "1"
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      # Must precede typecheck/build: web's tsc (TS 5.7) resolves from
      # web/node_modules — without this, npm falls back to the root
      # typescript@7 devDep, which rejects web/tsconfig.json (baseUrl removed).
      - name: Install web dependencies
        run: npm run web:install

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Locale parity
        run: npm run check:locales

      # e2e serves web/dist via express.static; build with the e2e test seam
      # (window.__chatStore) — release builds never set VITE_E2E_SEAM.
      - name: Build web (e2e seam)
        run: npm run web:build:e2e

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # The e2e server spawns the dsh runtime child (dsh-bridge.js COMMAND);
      # pinned to the same rc line the homebrew/dev installs use. The server
      # only patches an existing profile, so bootstrap it like a fresh machine
      # (dsh needs pnpm on PATH to manage profile plugins). The bundle version
      # must be pinned: the unpinned add resolves dsh-base 0.0.1-rc.1, whose
      # dep dsh-user-interaction is not published (404).
      - name: Install dsh runtime CLI + platform profile
        run: |
          npm install -g @deepseek-ai/dsh@0.1.1-rc.2 pnpm@10.18.3
          # Bootstrap a fresh-machine profile (verified recipe; the dev profile
          # was hand-built and server.js only patches an existing profile):
          # 1. bundle add initializes the profile but fails on pnpm 10's
          #    native build gate -> allowlist the builds, complete the install
          # 2. the jsonrpc-server plugin (what dsh-bridge talks to) is NOT in
          #    the dsh-base bundle -> install it + insert via cordis.patch.yml;
          #    it imports dsh-sdk-protocol without declaring it -> add that too
          dsh plugin --profile platform add @deepseek-ai/dsh-base@0.1.1-rc.2 || true
          node -e '
            const fs = require("fs");
            const p = `${process.env.HOME}/.dsh/profiles/platform/package.json`;
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.pnpm = j.pnpm || {};
            j.pnpm.onlyBuiltDependencies = [
              "@deepseek-ai/dsh-subprocess-local",
              "@google/genai",
              "koffi",
              "node-pty",
              "protobufjs",
            ];
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
          '
          pnpm --dir "$HOME/.dsh/profiles/platform" install
          pnpm --dir "$HOME/.dsh/profiles/platform" add @deepseek-ai/dsh-sdk-jsonrpc-server@0.0.1-rc.5 @deepseek-ai/dsh-sdk-protocol@0.1.1-rc.2
          printf '%s\n' \
            '- insert:' \
            '    - id: sdk-jsonrpc-server' \
            "      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'" \
            > "$HOME/.dsh/profiles/platform/cordis.patch.yml"

      - name: E2E (fast project, offline)
        timeout-minutes: 15
        run: npm run test:e2e
