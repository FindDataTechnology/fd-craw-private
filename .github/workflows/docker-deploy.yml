# ── CI/CD: build → America Harbor → chengsi bridge → cheap-2 deploy ───────────
#
# Network reality (all verified 2026-08-29):
#   - cheap-2 (103.236.89.174:20400) is reachable ONLY from Chinese IPs;
#     GitHub runners and America cannot SSH in.
#   - cheap-2 has no usable cross-border egress (every foreign registry
#     times out) — images must be pushed to it over SSH from China.
#   - chengsi box (124.220.7.175) reaches America at ~5.7 MB/s and can
#     SSH into cheap-2 — it is the delivery bridge.
#   - GitHub↔chengsi is GFW-throttled to ~27 KB/s, so the image must NOT
#     travel that leg; it goes via America's Harbor instead.
#
# Pipeline:
#   build  (GH runner): docker build → push to America Harbor (US→US, fast)
#   deploy (GH runner): ssh chengsi → fetch-deploy.sh <tag>: pulls from
#     America Harbor, pipes `docker save` into cheap-2 `docker load`, then
#     runs cheap-2's health-gated blue/green swap (deploy-platform.sh;
#     failure keeps the current container).
#
# Required GitHub Secrets:
#   HARBOR_HOST/USER/PASS    America Harbor (23.144.68.246:30880, HTTP)
#   JUMP_HOST/USER/PASS      chengsi bridge (fetch-deploy.sh lives there)
#   DEPLOY_SSH_PASS          cheap-2 password (passed to fetch-deploy.sh)

name: docker-deploy

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - '*.js'
      - 'web/**'
      - 'scripts/**'
      - 'supervisor/**'
      - 'bootstrap/**'
      - 'skills/**'
      - 'package*.json'
      - 'web/package*.json'
      - 'platform.bundle.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Build + push image only, do NOT redeploy the container'
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ secrets.HARBOR_HOST }}/paas_private/platform

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Allow insecure (HTTP) Harbor
        run: |
          echo '{"insecure-registries":["${{ secrets.HARBOR_HOST }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Build & push image
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          docker build -f Dockerfile -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  deploy:
    needs: build-push
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via chengsi bridge (detached + polled)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          JUMP="sshpass -p '${{ secrets.JUMP_PASS }}' ssh -o StrictHostKeyChecking=no ${{ secrets.JUMP_USER }}@${{ secrets.JUMP_HOST }}"
          # Long-lived cross-border SSH sessions get killed mid-flight, so the
          # transfer runs detached on the bridge and this job only polls it.
          $JUMP "echo '${{ secrets.JUMP_PASS }}' | sudo -S bash -c 'pkill -f fetch-deploy.sh 2>/dev/null; setsid nohup /usr/local/bin/fetch-deploy.sh ${{ needs.build-push.outputs.tag }} \"${{ secrets.DEPLOY_SSH_PASS }}\" > /tmp/fetch-deploy.log 2>&1 &' ; echo started"
          for i in $(seq 1 60); do
            sleep 30
            OUT=$($JUMP "tail -3 /tmp/fetch-deploy.log" 2>/dev/null || true)
            echo "$OUT" | tail -2
            echo "$OUT" | grep -q "DEPLOYED" && { echo "✓ deployed ${{ needs.build-push.outputs.tag }}"; exit 0; }
            echo "$OUT" | grep -qE "unhealthy|not loaded|no space|cannot|Error" && { echo "✗ deploy failed"; $JUMP "cat /tmp/fetch-deploy.log"; exit 1; }
          done
          echo "timed out after 30 min"; $JUMP "cat /tmp/fetch-deploy.log"; exit 1
