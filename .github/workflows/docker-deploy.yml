# ── CI/CD: build image, ship via chengsi jump host, deploy on china-cheap-2 ───
#
# Network reality (verified 2026-08-29): the cheap servers
# (103.236.89.174, SSH 20400 via sslh) are reachable ONLY from Chinese
# IPs — GitHub runners (US) and the America server cannot SSH in, and
# the cheap boxes cannot pull from any public registry (cross-border
# egress times out). The user's Tencent box (china-tencent-chengsi,
# 124.220.7.175) reaches both the runners and cheap-2 — it is the
# delivery bridge.
#
# Pipeline:
#   build  (GH runner): docker build → docker save | zstd → artifact
#   deploy (GH runner): download artifact → stream via jump host into
#                       cheap-2 docker load → /usr/local/bin/deploy-platform.sh
#                       (health-gated blue/green swap; fails = keep old container)
#
# Required GitHub Secrets:
#   DEPLOY_SSH_HOST / DEPLOY_SSH_PORT / DEPLOY_SSH_USER / DEPLOY_SSH_PASS  (cheap-2)
#   JUMP_HOST / JUMP_USER / JUMP_PASS                                      (bridge)

name: docker-deploy

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - '*.js'
      - 'web/**'
      - 'scripts/**'
      - 'supervisor/**'
      - 'bootstrap/**'
      - 'skills/**'
      - 'package*.json'
      - 'web/package*.json'
      - 'platform.bundle.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Build image only, do NOT redeploy the container'
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -f Dockerfile -t platform:${{ steps.tag.outputs.tag }} .
          mkdir -p out
          docker save platform:${{ steps.tag.outputs.tag }} | zstd -T0 -3 -o out/platform.tar.zst
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: platform-image
          path: out/platform.tar.zst
          retention-days: 14
          compression-level: 0 # already zstd-compressed

  deploy:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: platform-image

      - name: Stream image through jump host into cheap-2
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass zstd >/dev/null
          zstd -dc < platform.tar.zst | \
            sshpass -p "${{ secrets.JUMP_PASS }}" ssh -o StrictHostKeyChecking=no \
              ${{ secrets.JUMP_USER }}@${{ secrets.JUMP_HOST }} \
              "sshpass -p '${{ secrets.DEPLOY_SSH_PASS }}' ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT }} ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} 'docker load'"

      - name: Blue/green swap with health gate
        run: |
          sshpass -p "${{ secrets.JUMP_PASS }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.JUMP_USER }}@${{ secrets.JUMP_HOST }} \
            "sshpass -p '${{ secrets.DEPLOY_SSH_PASS }}' ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT }} ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} 'deploy-platform.sh ${{ needs.build.outputs.tag }}'"
          echo "Deployed ${{ needs.build.outputs.tag }} — verify: http://103.236.89.174:20400/api/config"
